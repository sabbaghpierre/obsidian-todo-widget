name: Android release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_NAME: ${{ github.event.repository.name }}.apk
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Assemble release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Align, sign, and verify APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS_PASSWORD: ${{ secrets.SIGNING_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          aligned="$RUNNER_TEMP/release-aligned.apk"
          apk="$RUNNER_TEMP/$APK_NAME"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          trap 'rm -f "$keystore" "$aligned"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$keystore"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$aligned"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_ALIAS_PASSWORD \
            --out "$apk" "$aligned"
          "$tools/apksigner" verify --verbose "$apk"

      - name: Generate release notes and publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft] | @tsv')"
          previous_tag=""
          release_exists=false
          while IFS=$'\t' read -r candidate draft; do
            [[ -n "$candidate" ]] || continue
            if [[ "$candidate" == "$RELEASE_TAG" ]]; then
              release_exists=true
            elif [[ "$draft" == false && -z "$previous_tag" ]] && \
              git rev-parse --verify --quiet "refs/tags/$candidate^{commit}" > /dev/null && \
              git merge-base --is-ancestor "refs/tags/$candidate^{commit}" HEAD; then
              previous_tag="$candidate"
            fi
          done <<< "$releases"

          range=HEAD
          if [[ -n "$previous_tag" ]]; then
            range="refs/tags/$previous_tag..HEAD"
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '## Changes\n\n'
            git log --no-merges --format='- %s (%h)' "$range" --
            if [[ -n "$previous_tag" ]]; then
              printf '\n**Full changelog:** %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GH_REPO" "$previous_tag" "$RELEASE_TAG"
            fi
          } > "$notes"

          if [[ "$release_exists" == true ]]; then
            gh release upload --clobber -- "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME"
            gh release edit --title "$RELEASE_TAG" --notes-file "$notes" --draft=false -- "$RELEASE_TAG"
          else
            gh release create --verify-tag --title "$RELEASE_TAG" --notes-file "$notes" \
              -- "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME"
          fi
